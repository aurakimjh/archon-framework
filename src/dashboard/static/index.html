<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archon Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Archon Dashboard</h1>
    <span id="connection-status" style="color:var(--muted);font-size:0.85rem;">Connecting...</span>
  </header>

  <!-- Summary Cards -->
  <div class="grid">
    <div class="card">
      <h3>Projects</h3>
      <div class="value" id="project-count">-</div>
    </div>
    <div class="card">
      <h3>Active Agents</h3>
      <div class="value" id="agent-count">-</div>
    </div>
    <div class="card">
      <h3>Today's Cost</h3>
      <div class="value" id="total-cost">$0.00</div>
    </div>
    <div class="card">
      <h3>Gate Queue</h3>
      <div class="value" id="gate-count">0</div>
    </div>
    <div class="card">
      <h3>Success Rate</h3>
      <div class="value" id="success-rate">-</div>
    </div>
  </div>

  <!-- Task Control -->
  <div class="section">
    <h2>Task Control</h2>
    <div class="card">
      <form id="task-form">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <input type="text" id="task-project-id" placeholder="Project ID" value="demo-project" style="flex: 1;">
          <select id="task-agent-role">
            <option value="backend">Backend</option>
            <option value="frontend">Frontend</option>
            <option value="tester">Tester</option>
            <option value="devops">DevOps</option>
            <option value="docs">Docs</option>
          </select>
          <select id="task-scenario">
            <option value="auto_pass">AUTO_PASS (Clean)</option>
            <option value="l1">L1_REWORK (Lint Fail)</option>
            <option value="l2">L2_HUMAN (Low Score)</option>
            <option value="l1_exhausted">L1 Exhausted</option>
          </select>
          <label><input type="checkbox" id="task-mock" checked> Mock Mode</label>
        </div>
        <textarea id="task-instructions" placeholder="Enter task instructions here..." style="width: 100%; height: 80px; margin-bottom: 10px;"></textarea>
        <button type="submit" class="primary">Execute Task</button>
      </form>
    </div>
  </div>

  <!-- Projects Table -->
  <div class="section">
    <h2>Projects</h2>
    <div class="card">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Priority</th></tr></thead>
        <tbody id="projects-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Agents Table -->
  <div class="section">
    <h2>Agent Status</h2>
    <div class="card">
      <table>
        <thead><tr><th>Role</th><th>Health</th><th>Failures</th><th>Latency</th></tr></thead>
        <tbody id="agents-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Gate Queue -->
  <div class="section">
    <h2>Human Gate Queue</h2>
    <div class="card">
      <table>
        <thead><tr><th>Handoff</th><th>Project</th><th>Level</th><th>Agent</th><th>Action</th></tr></thead>
        <tbody id="gates-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Events Log -->
  <div class="section">
    <h2>Live Events</h2>
    <div id="events-log"></div>
  </div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
