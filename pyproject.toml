[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archon-framework"
version = "0.1.0a1"
description = "Multi-agent AI development platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Aura Kim", email = "aura.kimjh@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
keywords = ["ai", "multi-agent", "llm", "orchestration", "framework"]
dependencies = [
    "pydantic>=2.0,<3.0",
    "litellm>=1.40",
    "ray>=2.30",
    "redis>=5.0",
    "chromadb>=0.5",
    "mem0ai>=0.1",
    "httpx>=0.27",
    "rich>=13.0",
    "structlog>=24.0",
]

[project.urls]
Homepage = "https://github.com/aurakimjh/archon-framework"
Repository = "https://github.com/aurakimjh/archon-framework"
Issues = "https://github.com/aurakimjh/archon-framework/issues"

[project.scripts]
archon = "archon.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "fakeredis>=2.0",
]
observability = [
    "langsmith>=0.1",
    "langfuse>=2.0",
]
dashboard = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["archon", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
